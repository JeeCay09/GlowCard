<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GlowCard Raster</title>
    <style>
      /* Emulates HA's sections grid: 12 columns, rows of 56 px, 8 px gaps. */
      body {
        margin: 0;
        padding: 16px;
        background: #111;
        font-family: system-ui, sans-serif;
      }
      .section {
        width: var(--w, 520px);
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        grid-auto-rows: 56px;
        gap: 8px;
      }
      /* ?rows=1 draws HA's 56 px rows behind the cards (only for checking heights). */
      .section.rows {
        background-image: repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.06) 0 56px,
          transparent 56px 64px
        );
      }
      .tile {
        box-sizing: border-box;
        border-radius: 12px;
        background: #1c1c1c;
        border: 1px solid #2f2f2f;
        color: #ddd;
        font-size: 14px;
        display: flex;
        align-items: center;
        padding: 0 14px;
      }
    </style>
  </head>
  <body>
    <div class="section" data-dark></div>
    <script type="module">
      import '../dist/glowcard.js';
      import { mount } from './build/demo.js';
      const params = new URLSearchParams(location.search);
      if (params.get('w')) document.body.style.setProperty('--w', `${params.get('w')}px`);
      const size = params.get('size') ?? 'normal';
      const section = document.querySelector('.section');
      if (params.get('rows')) section.classList.add('rows');
      const cards = [
        ['glowcard-light', { entity: 'light.living', size }],
        ['ha-tile', 'Decke (HA)', 6, 1],
        ['ha-tile', 'LED Leiste (HA)', 6, 1],
        ['glowcard-switch', { entity: 'switch.sprinkler', size }],
        ['glowcard-switch', { entity: 'switch.night_light', size }],
        ['glowcard-light', { entity: 'light.kitchen', size: 'mini' }],
        ['ha-tile', 'Tile (HA)', 6, 1],
        ['glowcard-switch', { entity: 'switch.dnd', size: 'mini' }],
        ['glowcard-switch', { entity: 'switch.desk_plug', size: 'mini', show_power: true }],
        ['glowcard-switch', { entity: 'switch.desk_plug', show_power: true, size }],
        ['glowcard-status', { weather: 'weather.home', all_lights: true, size }],
        ['glowcard-chip', { chip: 'lights' }],
        ['ha-tile', 'Tile (HA)', 6, 1],
      ];
      const night = {
        home: 'sensor.house_power_night',
        devices: [
          { entity: 'sensor.heat_pump_power', name: 'Steckdose - Home Office' },
          { entity: 'sensor.tv_power', name: 'Waschmaschine Leistung' },
          { entity: 'sensor.fridge_power', name: 'Steckdose - Wäschetrockner' },
        ],
        energy_today: 'sensor.energy_today_night',
        solar: 'sensor.pvn_power',
        battery: 'sensor.batn_soc',
        battery_power: 'sensor.batn_power',
        grid: 'sensor.gridn_power',
        solar_energy: 'sensor.pv_energy_today',
        grid_import_energy: 'sensor.import3_today',
        grid_export_energy: 'sensor.export3_today',
      };
      const energy = [
        ['glowcard-energy', night],
        [
          'glowcard-energy',
          {
            ...night,
            home: 'sensor.house_power',
            solar: 'sensor.pv3_power',
            battery: 'sensor.bat3_soc',
            battery_power: 'sensor.bat3_power',
            grid: 'sensor.grid3_power',
          },
        ],
        [
          'glowcard-energy',
          {
            home: 'sensor.house_power',
            devices: night.devices,
            energy_today: 'sensor.energy_today',
          },
        ],
        ['glowcard-energy', { ...night, font: 'theme' }],
      ];
      const waste = [
        ['glowcard-waste', { entities: ['calendar.waste'], size }],
        ['glowcard-waste', { entities: ['calendar.waste'], size }, 6],
        ['glowcard-waste', { entities: ['calendar.waste'], size }, 6],
        ['glowcard-waste', { entities: ['calendar.waste_same_day'], size }],
        [
          'glowcard-waste',
          { entities: ['sensor.waste_paper', 'sensor.waste_yellow', 'sensor.waste_rest'], size },
        ],
        ['ha-tile', 'Tile (HA)', 6, 1],
        ['ha-tile', 'Tile (HA)', 6, 1],
      ];
      const media = [
        ['glowcard-media', { entity: 'media_player.kitchen', size }],
        ['glowcard-media', { entity: 'media_player.living_tv', size }],
        ['glowcard-media', { entity: 'media_player.bath', size }],
        ['glowcard-media', { entity: 'media_player.terrace', size }],
        ['glowcard-media', { entity: 'media_player.kitchen', size }, 12],
        ['glowcard-media', { entity: 'media_player.long', size }, 12],
        ['glowcard-media', { entity: 'media_player.long', size }, 6],
        ['glowcard-media', { entity: 'media_player.living_tv', size }, 9],
        [
          'glowcard-media-rooms',
          {
            name: 'Musik im Haus',
            entities: [
              'media_player.kitchen',
              'media_player.living_tv',
              'media_player.bath',
              'media_player.terrace',
            ],
          },
        ],
      ];
      if (params.get('light')) {
        section.removeAttribute('data-dark');
        document.body.style.background = '#e7e9ef';
      }
      const set = params.get('set');
      for (const [tag, config, c0, r0] of set === 'energy'
        ? energy
        : set === 'waste'
          ? waste
          : set === 'media'
            ? media
            : cards) {
        let cols = c0;
        let rows = r0;
        let el;
        if (tag === 'ha-tile') {
          el = document.createElement('div');
          el.className = 'tile';
          el.textContent = config;
        } else {
          el = document.createElement(tag);
          el.dataset.card = '';
          el.setConfig({ type: `custom:${tag}`, ...config });
          const o = el.getGridOptions();
          cols = c0 ?? o.columns;
          rows = o.rows;
        }
        el.style.gridColumn = `span ${cols}`;
        el.style.gridRow = `span ${rows}`;
        section.appendChild(el);
      }
      mount(document);
    </script>
  </body>
</html>
