<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GlowCard Vorschau</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        color: #888;
      }
      .wall {
        position: relative;
        overflow: hidden;
        padding: 28px 40px;
        background: #e7e9ef;
      }
      .wall[data-dark] {
        background: #07080b;
      }
      .wall::before,
      .wall::after {
        content: '';
        position: absolute;
        width: 760px;
        height: 760px;
        border-radius: 50%;
        z-index: 0;
      }
      .wall::before {
        left: -200px;
        top: -200px;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.22) 0%, rgba(99, 102, 241, 0) 65%);
      }
      .wall::after {
        left: 520px;
        top: 160px;
        background: radial-gradient(circle, rgba(245, 165, 36, 0.2) 0%, rgba(245, 165, 36, 0) 65%);
      }
      .wall > * {
        position: relative;
        z-index: 1;
      }
      .grid {
        width: 888px;
        max-width: 100%;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
      }
      .span2 {
        grid-column: span 2;
      }
      .span4 {
        grid-column: span 4;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <section class="wall" data-dark>
      <h1>Dunkel</h1>
      <div class="grid"></div>
    </section>
    <section class="wall">
      <h1>Hell</h1>
      <div class="grid"></div>
    </section>
    <script type="module">
      import '../dist/glowcard.js';
      import { mount } from './build/demo.js';
      const lights = [1, 2, 3].map((n) => `light.tv_wand_streifen_${n}`);
      const energy = {
        solar: 'sensor.sigen_plant_pv_power',
        battery: 'sensor.sigen_battery_soc',
        battery_power: 'sensor.sigen_battery_power',
        grid: 'sensor.sigen_grid_power',
        home: 'sensor.sigen_home_power',
      };
      const security = [
        { entity: 'binary_sensor.fenster_bad', name: 'Fenster Bad' },
        { entity: 'binary_sensor.rauchmelder_alle', name: 'Rauchmelder' },
        { entity: 'binary_sensor.basisstation_alarm', name: 'Basisstation' },
      ];
      const weather = {
        type: 'weather',
        entity: 'weather.wetter_home',
        tap_action: { action: 'none' },
      };
      const statusCards = [
        ['glowcard-header', { persons: ['person.gilbert', 'person.sam'] }, 'span4'],
        [
          'glowcard-status',
          {
            segments: [
              weather,
              { type: 'lights', entities: lights },
              { type: 'energy', ...energy },
              { type: 'security', entities: security },
              { type: 'alert', entity: 'binary_sensor.vesta_problem' },
            ],
          },
          'span4',
        ],
        [
          'glowcard-chip',
          {
            chips: [
              weather,
              { type: 'lights', entities: lights },
              { type: 'person', entity: 'person.gilbert', tap_action: { action: 'none' } },
              { type: 'battery', ...energy },
              { type: 'security', entities: security },
              { type: 'alert', entity: 'binary_sensor.vesta_problem' },
              {
                type: 'entity',
                entity: 'switch.terrace',
                name: 'Steckdose Terrasse',
                icon: 'mdi:power-plug',
              },
            ],
          },
          'span4',
        ],
        [
          'glowcard-chip',
          {
            icon_only: true,
            chips: [
              weather,
              { type: 'lights', entities: lights },
              { type: 'energy', ...energy },
              { type: 'security', entities: security },
              { type: 'alert', entity: 'binary_sensor.vesta_problem' },
            ],
          },
          'span4',
        ],
      ];
      const living = 'sensor.temperatursensor_wohnzimmer';
      const headingCards = [
        [
          'glowcard-heading',
          {
            heading: 'Wohnzimmer',
            subtitle: 'Erdgeschoss',
            icon: 'mdi:sofa-outline',
            badges: [
              `${living}_temperature`,
              `${living}_humidity`,
              { type: 'lights', entities: lights },
              `${living}_battery`,
            ],
          },
          'span4',
        ],
        [
          'glowcard-heading',
          {
            heading: 'Wohnzimmer',
            subtitle: 'Optional: Symbol leuchtet bei TV Wand',
            icon: 'mdi:sofa-outline',
            glow_entity: 'light.tv_wand',
            badges: [`${living}_temperature`, { type: 'lights', entities: lights }],
          },
          'span4',
        ],
        [
          'glowcard-heading',
          {
            heading_style: 'subtitle',
            heading: 'Erdgeschoss',
            subtitle: '6 Räume · 3 Lichter an',
            glow_entity: 'light.tv_wand',
          },
          'span4',
        ],
        [
          'glowcard-heading',
          {
            heading_style: 'subtitle',
            heading: '1. Etage',
            badges: ['sensor.temperatursensor_bad_temperature'],
          },
          'span4',
        ],
        [
          'glowcard-heading',
          {
            heading: 'Garten',
            subtitle: 'Draußen · Vorbeet · Schuppen',
            icon: 'mdi:flower-outline',
            glow_entity: 'light.tv_wand',
            glow_color: 'green',
            tap_action: { action: 'navigate', navigation_path: '#garten' },
            badges: [weather, 'sensor.bodenfeuchte_vorbeet_temperature'],
          },
          'span4',
        ],
      ];
      const classicCards = [
        ['glowcard-light', { entity: 'light.living' }, 'span2'],
        ['glowcard-light', { entity: 'light.tv_wall', icon: 'mdi:television' }, 'span2'],
        ['glowcard-light', { entity: 'light.hall' }, 'span2'],
        ['glowcard-light', { entity: 'light.led_strip', icon: 'mdi:led-strip-variant' }, 'span2'],
        ['glowcard-light', { entity: 'light.kitchen' }, 'span2'],
        ['glowcard-light', { entity: 'light.kitchen', size: 'mini' }, 'span2'],
        ['glowcard-light', { entity: 'light.hall', size: 'mini' }, 'span2'],
        [
          'glowcard-switch',
          { entity: 'switch.sprinkler', icon: 'mdi:sprinkler', color: 'sky' },
          '',
        ],
        [
          'glowcard-switch',
          { entity: 'input_boolean.f1_live', icon: 'mdi:flag-checkered', color: 'heat' },
          '',
        ],
        [
          'glowcard-switch',
          { entity: 'switch.night_light', icon: 'mdi:lightbulb', color: 'amber' },
          '',
        ],
        [
          'glowcard-switch',
          { entity: 'switch.dnd', icon: 'mdi:moon-waning-crescent', color: 'violet' },
          '',
        ],
        [
          'glowcard-switch',
          {
            entity: 'input_boolean.tv_warm',
            icon: 'mdi:television',
            color: '#FFC872',
            variant: 'wide',
          },
          'span2',
        ],
        [
          'glowcard-switch',
          {
            name: 'Rauchmelder-LEDs',
            icon: 'mdi:smoke-detector',
            color: 'green',
            entities: [0, 1, 2, 3, 4, 5].map((i) => ({
              entity: `switch.led_${i}`,
              name: ['Esszimmer', 'Flur oben', 'Dachboden', 'Kinderzimmer', 'Büro', 'Schlafzimmer'][i],
            })),
          },
          'span2',
        ],
        [
          'glowcard-switch',
          { entity: 'switch.carpet_boost', icon: 'mdi:flash', color: 'cyan', size: 'mini' },
          'span2',
        ],
        [
          'glowcard-switch',
          { entity: 'switch.dishwasher', icon: 'mdi:dishwasher', color: 'indigo', size: 'mini' },
          'span2',
        ],
        ['glowcard-switch', { entity: 'switch.home_office' }, ''],
        ['glowcard-switch', { entity: 'switch.dryer', show_power: true, size: 'mini' }, 'span2'],
        ['glowcard-switch', { entity: 'switch.bedroom_plug' }, ''],
        ['glowcard-switch', { entity: 'switch.fairy_lights' }, ''],
        ['glowcard-switch', { entity: 'switch.home_office', show_power: true }, 'span4'],
      ];
      const set = new URLSearchParams(location.search).get('set');
      const cards =
        set === 'status'
          ? statusCards
          : set === 'heading'
            ? headingCards
            : set === 'classic'
              ? classicCards
              : [...statusCards, ...headingCards, ...classicCards];
      for (const grid of document.querySelectorAll('.grid')) {
        for (const [tag, config, cls] of cards) {
          const el = document.createElement(tag);
          el.dataset.card = '';
          if (cls) el.className = cls;
          el.setConfig({ type: `custom:${tag}`, ...config });
          grid.appendChild(el);
        }
      }
      mount(document);
    </script>
  </body>
</html>
